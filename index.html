/* cover ui */
#startBtn {
  position: fixed;
  left: 50%;           /* 가운데 기준으로 이동 */
  bottom: 20px;        /* 기존 위치 유지 */
  transform: translateX(-50%);  /* 자기 너비의 절반만큼 왼쪽으로 이동해서 정확히 중앙 정렬 */
  
  z-index: 30;
  padding: 12px 16px;
  font-size: 16px;
  font-weight: 400;
  border: none;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0);  /* ← 불투명도 0% (완전 투명) */
  color: #ffffff;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
#startBtn:hover { background: #212121; }

#coverLoading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:18px;z-index:40;letter-spacing:.2px;transition:opacity .25s}

/* === UI facelift (Figma → CSS only, no HTML/JS change) === */

/* Base typography */
:root{
  --label-small-font-size: 9px;
  --label-medium-font-size: 11px;
  --label-large-font-size: 12px;
  --title-medium-font-size: 12px;
  --title-large-font-size: 16px;
}
body, button, input, select {
  font-family: 'Azeret Mono', monospace;
}

/* Topbar buttons (dance & home) */
.topbar .btn{
  height:41px; padding:0 14px; border-radius:10px;
  background: rgba(255,255,255,0.15);
  color:#fff; border:1px solid rgba(255,255,255,0.25);
  font-size: var(--label-large-font-size);
  letter-spacing: .02em;
  transition: background .15s, transform .05s;
}
.topbar .btn:hover{ background: rgba(255,255,255,0.25); }
.topbar .btn:active{ transform: translateY(1px); }

/* Left panel glass look */
.ui{
  background: rgba(255,255,255,0.8) !important;
  backdrop-filter: blur(6px);
  border-radius: 12px;
  overflow: hidden;
}
.ui .row strong{
  font-size: var(--title-large-font-size);
  line-height: 20px;
  color:#000;
}

/* View buttons (Front/Side/Top) */
.ui .row .btn.view,
#btnXZ, #btnXY, #btnYZ{
  height:28px; border-radius:8px;
  border:1px solid rgba(0,0,0,.2);
  background:#fff; color:#000;
  font-size: var(--label-medium-font-size);
  padding:0 10px;
}
/* When active (you may already toggle classes in JS; keep visual stronger) */
#btnXZ.active, #btnXY.active, #btnYZ.active{
  border-color:#000;
}

/* Selects (Part / Bone / Mode) */
select#partSel, select#boneSel, select#renderMode{
  height: 26px; border-radius: 8px;
  background: rgba(255,255,255,0.8);
  border: 1px solid rgba(0,0,0,.2);
  padding: 0 8px;
  font-size: var(--label-medium-font-size);
}

/* Sliders (Tempo / Trail / Tone / Size) */
input[type="range"]{
  -webkit-appearance:none; appearance:none;
  height:4px; border-radius:999px;
  background: rgba(0,0,0,.15);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:14px; height:14px; border-radius:50%;
  background:#000; box-shadow:0 0 0 2px #fff;
  cursor:pointer;
}
input[type="range"]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%;
  background:#000; border:2px solid #fff; cursor:pointer;
}

/* Toggle style for checkboxes (CSS-only, no extra markup) */
/* Using background gradients to simulate the thumb */
#bgToggle, #hudToggle, #trailBgToggle, #figColorToggle, #figureToggleChk{
  -webkit-appearance:none; appearance:none;
  width:36px; height:20px; border-radius:999px;
  background:
    radial-gradient(#fff 8px, transparent 9px) left 2px center/16px 16px no-repeat,
    linear-gradient(transparent,transparent) center/100% 100% no-repeat;
  background-color: rgba(0,0,0,0.2);
  border: 1px solid rgba(0,0,0,.15);
  transition: background-position .2s ease, background-color .2s ease, border-color .2s;
  vertical-align: middle;
}
#bgToggle:checked, #hudToggle:checked, #trailBgToggle:checked, #figColorToggle:checked, #figureToggleChk:checked{
  background-position: right 2px center, center;
  background-color: rgba(0,0,0,0.5);
  border-color: rgba(0,0,0,.35);
}

/* Labels & small captions */
.ui label{ font-size: var(--label-medium-font-size); color:#000; }
.ui .legend .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.ui .legend{ gap:12px; display:flex; align-items:center; }

<script>
/* ===================== CONFIG / DATA SETUP ===================== */
const BASE_PATH = "";
const STYLES = [
  ["popping","Popping"],
  ["ballet","Ballet"],
  ["contemporary","Contemporary"],
  ["breakdance","Breakdance"],
  ["waacking","Waacking"],
  ["Haka","Haka"],
  ["irishtap","Irish Tap"],
  ["traditionalkorean","Traditional Korean"]
];
window.__COVER__ = {on:true};
let CURRENT_STYLE_KEY = (window.__COVER__ && window.__COVER__.on) ? "merged" : "popping";

let BG_LIGHT=252, BG_DARK=0; let useDarkBg=true;
let pSize=1.0;

let PANEL_RATIO=0.88, L_W, R_W; 
let PROJECTION='XZ';
const SCALE_MAG=0.96, MARGIN=30;
const FPS=30;
const MIN_WEIGHT=0.3, MAX_WEIGHT=14.0, BASE_ALPHA=10, MAX_ALPHA=255;
let HUE_SLOW=200, HUE_FAST=20, SAT_SLOW=85, SAT_FAST=100, BRI_SLOW=72, BRI_FAST=100;
const CURVE_SUBDIV_FACTOR=0.16, SMOOTH_ALPHA_BASE=0.18, FRAME_SKIP=1;
const DATA_TICK_MODE='count', DATA_TICKS=10, DATA_STEP=0.1, MINOR_SUBDIV=4;
const AXIS_LABEL_SIZE=12, AXIS_NAME_SIZE=12, LABEL_DECIMALS=2;
let DATA_GRID_COLOR=[0,0,0,26], DATA_GRID_MAJOR=1.0, DATA_GRID_MINOR=0.6, DATA_AXIS_COLOR=[0,0,0,140], DATA_LABEL_COLOR=[0,0,0,190];
/* Figure box */

// === Figure color mode (single vs by body part) ===
let FIG_COLOR_MULTI = false;            // false=single, true=per-part
let FIG_PART_PALETTE = [];              // 7 hues (deg), randomized once
function randomFigPalette(){
  // Pick 7 hues roughly evenly spread but randomized
  const base = Math.floor(Math.random()*360);
  const step = Math.floor(360/7);
  const jitter = ()=> (Math.random()*26 - 13); // ±13° jitter
  FIG_PART_PALETTE = Array.from({length:7}, (_,i)=> (base + i*step + jitter() + 360)%360);
}
randomFigPalette();

// Map a joint name (key from JOINT_ALIASES) to one of 7 part indices

function _partIndexForJoint(j){
  // 0: neck/head, 1: torso, 2: L arm+hand, 3: R arm+hand, 4: pelvis/hips, 5: L leg+foot, 6: R leg+foot
  const k = (j||'').toLowerCase();
  if(k.startsWith('neck') || k==='head') return 0;
  if(k.startsWith('spine') || k==='lclav' || k==='rclav') return 1;
  if(k.startsWith('lupperarm')||k.startsWith('llowerarm')||k.startsWith('lwrist')||k.startsWith('lthumb')||k.startsWith('lindex')||k.startsWith('lmiddle')||k.startsWith('lring')||k.startsWith('lpinky')) return 2;
  if(k.startsWith('rupperarm')||k.startsWith('rlowerarm')||k.startsWith('rwrist')||k.startsWith('rthumb')||k.startsWith('rindex')||k.startsWith('rmiddle')||k.startsWith('rring')||k.startsWith('rpinky')) return 3;
  if(k==='hips') return 4;
  if(k.startsWith('lthigh')||k.startsWith('lknee')||k.startsWith('lankle')||k.startsWith('lball')) return 5;
  if(k.startsWith('rthigh')||k.startsWith('rknee')||k.startsWith('rankle')||k.startsWith('rball')) return 6;
  // fallback
  if(k.includes('l')) return 2; if(k.includes('r')) return 3;
  return 1;
}


// Get hue for an edge (a-b joints)
function hueForEdge(a,b,hueShift){
  if(!FIG_COLOR_MULTI) return (18 + hueShift) % 360;
  const gi = _partIndexForJoint(a);
  const hue = FIG_PART_PALETTE[gi % 7] || 18;
  return (hue + hueShift) % 360;
}
const FIG_BASE_SIZE = 220, FIG_PAD=12, FIG_MARGIN=12, FIG_BONE_W=3.2;

/* ===================== DATA & STATE ===================== */
let table, extent, extentVis, rows, bonesByPart, rowsByBone;
let segments, orderedSegs, contextLines;
let cx,cy,cz,s,pTL,pBR;               // left grid
let fcx,fcy,fcz,fs,fpTL,fpBR;         // figure grid
let lastMillis=0, playing=true;
let animFrameF=0, minFrame=0, maxFrame=0;

let activeBones = new Set();
let allVisibleBones = new Set();

let figBox = { cx:null, cy:null, size:FIG_BASE_SIZE };

  ['Hips','RThigh','RKnee','RAnkle','RBall'],

];
const normName=s=>(s||'').toLowerCase().replace(/^mixamorig[:]?/,'').replace(/[^a-z0-9_.]/g,'');
function isHiddenBone(name){
  const n=normName(name);
  return n==='root'||n.startsWith('root.')||n==='ik_hand_root'||n==='ik_foot_root'||n==='center_of_mass'||n==='centerofmass'||n==='interaction';
}
let jointToBone=null, autoEdges=[];
function scoredCandidates(aliases){
  const keys=Array.from(rowsByBone.keys()); const out=[];
  for(const k of keys){ const nk=normName(k); let score=0;
    for(const a of aliases){ const na=normName(a);
      if(nk===na) score+=120; else if(nk.endsWith(na)) score+=70; else if(nk.includes(na)) score+=35;
    } out.push({name:k,score});
  } return out.filter(c=>c.score>0).sort((a,b)=>b.score-a.score);
}
function buildJointMapping(){
  jointToBone={}; autoEdges=[];
  const pick=(key)=>{ const c=scoredCandidates(JOINT_ALIASES[key]||[]); if(c[0]) jointToBone[key]=c[0].name; };
  Object.keys(JOINT_ALIASES).forEach(pick);
  for(const chain of STICK_CHAINS){ let prev=null; for(const j of chain){ const bn=jointToBone[j]; if(!bn){ prev=null; continue; } if(prev) autoEdges.push([prev,j]); prev=j; } }
}

/* ===================== PARSE / BUILD ===================== */
function parseTableAndBuild(){
  extent={minX:1e9,maxX:-1e9,minY:1e9,maxY:-1e9,minZ:1e9,maxZ:-1e9};
  rows=[]; bonesByPart=new Map(); rowsByBone=new Map(); segments=[]; orderedSegs=[]; contextLines=[];
  jointToBone=null; autoEdges=[];
  idxCache.clear(); figState.clear();

  if(!table || table.getRowCount()===0){ showErr('CSV가 비었거나 로드 실패'); noLoop(); return; }

  minFrame=Infinity; maxFrame=-Infinity;
  for(let r=0;r<table.getRowCount();r++){
    const f=int(table.getString(r,'frame'));
    const b=table.getString(r,'bone');
    const p=table.getString(r,'part')||'Other';
    const x=parseFloat(table.getString(r,'x')), y=parseFloat(table.getString(r,'y')), z=parseFloat(table.getString(r,'z'));
    rows.push({f,b,p,x,y,z});
    if(!isHiddenBone(b)){
      extent.minX=Math.min(extent.minX,x); extent.maxX=Math.max(extent.maxX,x);
      extent.minY=Math.min(extent.minY,y); extent.maxY=Math.max(extent.maxY,y);
      extent.minZ=Math.min(extent.minZ,z); extent.maxZ=Math.max(extent.maxZ,z);
    }
    if(!bonesByPart.has(p)) bonesByPart.set(p,new Set()); bonesByPart.get(p).add(b);
    if(!rowsByBone.has(b)) rowsByBone.set(b,[]); rowsByBone.get(b).push({f,x,y,z});
    minFrame=Math.min(minFrame,f); maxFrame=Math.max(maxFrame,f);
  }
  for(const [k,arr] of rowsByBone) arr.sort((a,b)=>a.f-b.f);

  refreshBoneOptions();
  computeView(); computeFigureView();
  buildJointMapping();
  rebuildSegments();
  animFrameF=minFrame; lastMillis=millis();
}

function refreshBoneOptions(){
  if(!boneSel) return;
  const part = partSel ? partSel.value : 'ALL';
  let bones = [];
  if(part === 'ALL'){
    bones = Array.from(rowsByBone ? rowsByBone.keys() : []);
  } else {
    bones = Array.from(bonesByPart && bonesByPart.get(part) ? bonesByPart.get(part) : []);
  }
  bones = bones.filter(b=>!isHiddenBone(b)).sort();
  boneSel.innerHTML = '<option value="">— all bones in part —</option>' + bones.map(b=>`<option value="${b}">${b}</option>`).join('');
}

function buildStyleButtons(){
  const bar=document.getElementById('styleBar');
  STYLES.forEach(([key,label])=>{
    const btn=document.createElement('button');
    btn.className='btn'; btn.dataset.style=key; btn.textContent=label;
    if(key===CURRENT_STYLE_KEY) btn.classList.add('active');
    btn.onclick=()=>{
      [...bar.querySelectorAll('.btn[data-style]')].forEach(b=>b.classList.toggle('active', b===btn));
      CURRENT_STYLE_KEY=key;
      const CSV_NAME = `${BASE_PATH}all_bones_coords_${key}.csv`;
      statePill.textContent='loading…';
      loadTable(CSV_NAME,'csv','header',
        (tbl)=>{ table=tbl; parseTableAndBuild(); setTrailMid(); updateLegendTone(parseInt(toneSlider.value||0)); statePill.textContent='ready'; },
        (e)=>{ console.error('CSV load error',e); showErr('CSV를 불러오지 못했습니다: '+CSV_NAME); statePill.textContent='error'; }
      );
    };
    bar.insertBefore(btn, bar.querySelector('.spacer'));
  });
}

/* ===================== VIEW / GRID ===================== */
function computePanels(){ L_W=Math.floor(width*PANEL_RATIO); R_W=width-L_W; }
function setProjection(mode){
  PROJECTION=mode;
  btnXZ.classList.toggle('active',mode==='XZ'); btnXY.classList.toggle('active',mode==='XY'); btnYZ.classList.toggle('active',mode==='YZ');
  rebuildSegments(); _trailBG_dirty=true; computeFigureView();
}
function computeView(){
  const ex = extentVis || extent; if(!ex) return;
  const spanX=Math.max(1e-6,ex.maxX-ex.minX), spanY=Math.max(1e-6,ex.maxY-ex.minY), spanZ=Math.max(1e-6,ex.maxZ-ex.minZ);
  cx=(ex.minX+ex.maxX)/2; cy=(ex.minY+ex.maxY)/2; cz=(ex.minZ+ex.maxZ)/2;
  let sx,sy; const viewW=L_W, viewH=height;
  if(PROJECTION==='XY'){ sx=((viewW-MARGIN*2)*SCALE_MAG)/spanX; sy=((viewH-MARGIN*2)*SCALE_MAG)/spanY; }
  else if(PROJECTION==='XZ'){ sx=((viewW-MARGIN*2)*SCALE_MAG)/spanX; sy=((viewH-MARGIN*2)*SCALE_MAG)/spanZ; }
  else { sx=((viewW-MARGIN*2)*SCALE_MAG)/spanY; sy=((viewH-MARGIN*2)*SCALE_MAG)/spanZ; }
  s=Math.min(sx,sy);
  const W2S=(wx,wy)=> (PROJECTION==='XY')?{x:(wx-cx)*s,y:(wy-cy)*-s}:(PROJECTION==='XZ')?{x:(wx-cx)*s,y:(wy-cz)*-s}:{x:(wx-cy)*s,y:(wy-cz)*-s};
  if(PROJECTION==='XY'){ pTL=W2S(ex.minX,ex.maxY); pBR=W2S(ex.maxX,ex.minY); }
  else if(PROJECTION==='XZ'){ pTL=W2S(ex.minX,ex.maxZ); pBR=W2S(ex.maxX,ex.minZ); }
  else { pTL=W2S(ex.minY,ex.maxZ); pBR=W2S(ex.maxY,ex.minZ); }
}
function computeFigureView(){
  const ex = extent; if(!ex) return;
  const spanX=Math.max(1e-6,ex.maxX-ex.minX), spanY=Math.max(1e-6,ex.maxY-ex.minY), spanZ=Math.max(1e-6,ex.maxZ-ex.minZ);
  fcx=(ex.minX+ex.maxX)/2; fcy=(ex.minY+ex.maxY)/2; fcz=(ex.minZ+ex.maxZ)/2;
  let sx,sy;
  if(PROJECTION==='XY'){ sx=((L_W-MARGIN*2)*SCALE_MAG)/spanX; sy=((height-MARGIN*2)*SCALE_MAG)/spanY; }
  else if(PROJECTION==='XZ'){ sx=((L_W-MARGIN*2)*SCALE_MAG)/spanX; sy=((height-MARGIN*2)*SCALE_MAG)/spanZ; }
  else { sx=((L_W-MARGIN*2)*SCALE_MAG)/spanY; sy=((height-MARGIN*2)*SCALE_MAG)/spanZ; }
  fs=Math.min(sx,sy);
  const W2S=(wx,wy)=> (PROJECTION==='XY')?{x:(wx-fcx)*fs,y:(wy-fcy)*-fs}:(PROJECTION==='XZ')?{x:(wx-fcx)*fs,y:(wy-fcz)*-fs}:{x:(wx-fcy)*fs,y:(wy-fcz)*-fs};
  if(PROJECTION==='XY'){ fpTL=W2S(ex.minX,ex.maxY); fpBR=W2S(ex.maxX,ex.minY); }
  else if(PROJECTION==='XZ'){ fpTL=W2S(ex.minX,ex.maxZ); fpBR=W2S(ex.maxX,ex.minZ); }
  else { fpTL=W2S(ex.minY,ex.maxZ); fpBR=W2S(ex.maxY,ex.minZ); }
}

function drawDataGrid(){
  if(!extent || !pTL || !pBR) return;
  const ex = extentVis || extent;
  let axMin, axMax, ayMin, ayMax, axName, ayName;
  if (PROJECTION==='XY'){ axMin=ex.minX; axMax=ex.maxX; ayMin=ex.minY; ayMax=ex.maxY; axName='X'; ayName='Y'; }
  else if (PROJECTION==='XZ'){ axMin=ex.minX; axMax=ex.maxX; ayMin=ex.minZ; ayMax=ex.maxZ; axName='X'; ayName='Z'; }
  else { axMin=ex.minY; axMax=ex.maxY; ayMin=ex.minZ; ayMax=ex.maxZ; axName='Y'; ayName='Z'; }

  const xtMajor=(DATA_TICK_MODE==='step')?ticksByFixedStep(axMin,axMax,DATA_STEP):niceTicks(axMin,axMax,DATA_TICKS);
  const ytMajor=(DATA_TICK_MODE==='step')?ticksByFixedStep(ayMin,ayMax,DATA_STEP):niceTicks(ayMin,ayMax,DATA_TICKS);
  const xtMinor=subticks(xtMajor.ticks,MINOR_SUBDIV), ytMinor=subticks(ytMajor.ticks,MINOR_SUBDIV);
  const W2S=(wx,wy)=> (PROJECTION==='XY')?{x:(wx-cx)*s,y:(wy-cy)*-s}:(PROJECTION==='XZ')?{x:(wx-cx)*s,y:(wy-cz)*-s}:{x:(wx-cy)*s,y:(wy-cz)*-s};

  push();
  stroke(DATA_AXIS_COLOR[0],DATA_AXIS_COLOR[1],DATA_AXIS_COLOR[2],DATA_AXIS_COLOR[3]); strokeWeight(1.6); noFill();
  rectMode(CORNERS); rect(pTL.x,pTL.y,pBR.x,pBR.y);

  stroke(DATA_GRID_COLOR[0],DATA_GRID_COLOR[1],DATA_GRID_COLOR[2],DATA_GRID_COLOR[3]); strokeWeight(DATA_GRID_MINOR);
  for(const v of xtMinor){ if(v<=axMin+1e-9||v>=axMax-1e-9) continue; const p1=W2S(v,ayMin), p2=W2S(v,ayMax); line(p1.x,p1.y,p2.x,p2.y); }
  for(const v of ytMinor){ if(v<=ayMin+1e-9||v>=axMax-1e-9) continue; const p1=W2S(axMin,v), p2=W2S(axMax,v); line(p1.x,p1.y,p2.x,p2.y); }

  strokeWeight(DATA_GRID_MAJOR);
  for(const v of xtMajor.ticks){ const p1=W2S(v,ayMin), p2=W2S(v,ayMax); line(p1.x,p1.y,p2.x,p2.y); }
  for(const v of ytMajor.ticks){ const p1=W2S(axMin,v), p2=W2S(axMax,v); line(p1.x,p1.y,p2.x,p2.y); }
  pop();

  // labels
  push();
  noStroke(); fill(DATA_LABEL_COLOR[0],DATA_LABEL_COLOR[1],DATA_LABEL_COLOR[2],DATA_LABEL_COLOR[3]);
  textSize(AXIS_LABEL_SIZE); textAlign(CENTER,TOP);
  for(const v of xtMajor.ticks){ const p=W2S(v,ayMin); text(formatNum(v, LABEL_DECIMALS), p.x, pBR.y + 8); }
  textAlign(RIGHT,CENTER);
  for(const v of ytMajor.ticks){ const p=W2S(axMin,v); text(formatNum(v, LABEL_DECIMALS), pTL.x - 8, p.y); }
  textSize(AXIS_NAME_SIZE); textAlign(CENTER,BOTTOM);
  text(axName+' (FBX units)', (pTL.x+pBR.x)/2, pBR.y - 6);
  push(); translate(pTL.x + 10, (pTL.y+pBR.y)/2); rotate(-HALF_PI); textAlign(CENTER,TOP); text(ayName+' (FBX units)',0,0); pop();
  pop();
}

function rebuildSegments(){
  if(!rowsByBone) return;
  segments=[]; orderedSegs=[]; contextLines=[];
  extentVis = {minX:1e9,maxX:-1e9,minY:1e9,maxY:-1e9,minZ:1e9,maxZ:-1e9};
  const part=(partSel?partSel.value:'ALL'), boneFilter=(boneSel?boneSel.value:'');

  let updatedVis=false;
  for(const b of useBones){
    const arrFull=(rowsByBone.get(b)||[]);
    for(const q of arrFull){

/* ===================== SAMPLING ===================== */
function sampleBoneAtFrameF(bone, frameF){
  const arr=rowsByBone.get(bone); if(!arr||arr.length===0) return null;
  let i=idxCache.get(bone)||0; while(i<arr.length-2&&arr[i+1].f<frameF)i++; while(i>0&&arr[i].f>frameF)i--; idxCache.set(bone,i);
  const a=arr[i], b=arr[Math.min(i+1,arr.length-1)];
  const denom = Math.max(1e-6, (b.f - a.f));
  const t = constrain((frameF - a.f)/denom, 0, 1);
  if(!isFinite(t)) return {x:a.x, y:a.y, z:a.z};
  return {x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), z:lerp(a.z,b.z,t)};
}

      fill(baseH, 95, useDarkBg?100:65, 160);
      circle(px, py, (1.4 + 2.6*t)*pSize);
    }
  }
  drawingContext.restore();
}
else if(mode==='ionstream'){
  // Long fluorescent streaks with speed-based width
  drawingContext.save(); blendMode(ADD);
  for(let i=iStart;i<=iEnd;i++){
    const sg=orderedSegs[i], t=sg.tSm;
    const dir = Math.atan2(sg.b.y - sg.a.y, sg.b.x - sg.a.x);
    const len = (10 + 40*t) * pSize;
    const w   = (1.2 + 3.0*t) * pSize;
    const hue = hs(lerp(HUE_SLOW,HUE_FAST,t));
    stroke(hue, 100, useDarkBg?100:80, 220); strokeWeight(w);
    line(sg.b.x, sg.b.y, sg.b.x - Math.cos(dir)*len, sg.b.y - Math.sin(dir)*len);
  }
  drawingContext.restore();
}
else if(mode==='plasmaflux'){
  // Wavy neon bands (plasma-like)
  drawingContext.save(); blendMode(ADD); noFill();
  for(let i=iStart;i<=iEnd;i+=3){
    const sg=orderedSegs[i], t=sg.tSm;
    const hue = hs(lerp(HUE_SLOW,HUE_FAST,t));
    stroke(hue, 100, useDarkBg?100:85, 180); strokeWeight((1.2 + 2.2*t)*pSize);
    beginShape();
    const segs = 16;
    for(let k=0;k<=segs;k++){
      const f = k/segs;
      const x = lerp(sg.a.x, sg.b.x, f);
      const y = lerp(sg.a.y, sg.b.y, f) + Math.sin((frameCount*0.15) + f*TAU*2.0 + i*0.01)* (6 + 10*t);
      vertex(x,y);
    }
    endShape();
  }
  drawingContext.restore();
}




  if(orderedSegs[iEnd]){
    // const cur=orderedSegs[iEnd].b; noStroke(); fill(0,220); ellipse(cur.x,cur.y,10,10);
    const frameI=Math.round(animFrameF), timeSec=animFrameF/FPS; if(hudToggle && hudToggle.checked){ drawOverlay(frameI,timeSec); }
  }

  // figure box position (bottom-right of grid)
  if(pBR){
    const gridBottomY = height/2 + pBR.y;
    const maxPossibleSizeY = Math.max(40, gridBottomY - FIG_MARGIN);
    figBox.size = Math.min(FIG_BASE_SIZE, maxPossibleSizeY);
    const desiredCX = width/2 + pBR.x + FIG_PAD + figBox.size/2;
    const minCX = figBox.size/2 + FIG_MARGIN;
    const maxCX = width - figBox.size/2 - FIG_MARGIN;
    figBox.cx = constrain(desiredCX, minCX, maxCX);
    figBox.cy = gridBottomY - figBox.size/2;
  }
  pop();

  drawFigureMapped(animFrameF);

  statePill.textContent = playing ? 'playing' : 'paused';
  updateInfoBadge();
}

function upperBound(arr, frameF){
  let lo=0, hi=arr.length-1, ans=0; while(lo<=hi){ const mid=(lo+hi)>>1; if(arr[mid].frameF<=frameF){ ans=mid; lo=mid+1; } else hi=mid-1; } return ans;
}

/* ===================== FIGURE ===================== */
function drawFigureMapped(frameF){
  // cover-only: hide small figure
  if (window.__COVER__ && window.__COVER__.on) return;
  if(!rowsByBone || rowsByBone.size===0 || figBox.cx==null || figBox.cy==null) return;

  const smoothA = 0.25;
  const hueShift = (parseInt(toneSlider.value)||0);

  const worldToFigGrid = (p)=> {
    if(PROJECTION==='XY') return {x:(p.x-fcx)*fs, y:(p.y-fcy)*-fs};
    if(PROJECTION==='XZ') return {x:(p.x-fcx)*fs, y:(p.z-fcz)*-fs};
    return {x:(p.y-fcy)*fs, y:(p.z-fcz)*-fs};
  };
  const figGridToBox = (gx, gy)=>{
    const gx0 = Math.min(fpTL.x, fpBR.x), gx1 = Math.max(fpTL.x, fpBR.x);
    const gy0 = Math.min(fpTL.y, fpBR.y), gy1 = Math.max(fpTL.y, fpBR.y);
    const fx = map(gx, gx0, gx1, figBox.cx - figBox.size/2, figBox.cx + figBox.size/2);
    const fy = map(gy, gy0, gy1, figBox.cy - figBox.size/2, figBox.cy + figBox.size/2);
    return {x:fx, y:fy};
  };

  for(const bone of allVisibleBones){
    const p=sampleBoneAtFrameF(bone, frameF); if(!p) continue;
    const prev=figState.get(bone)||p;
    const sm={x:prev.x+(p.x-prev.x)*smoothA, y:prev.y+(p.y-prev.y)*smoothA, z:prev.z+(p.z-prev.z)*smoothA};
    figState.set(bone,sm);
  }

  const ctx = drawingContext;
  ctx.save();
  ctx.beginPath();
  const bx = Math.round(figBox.cx - figBox.size/2);
  const by = Math.round(figBox.cy - figBox.size/2);
  const bw = Math.round(figBox.size);
  const bh = Math.round(figBox.size);
  ctx.rect(bx, by, bw, bh);
  ctx.clip();

  noFill(); for(const [a,b] of autoEdges){
    stroke(hueForEdge(a,b,hueShift), 90, 95, 235);   // 배경과 무관하게 동일 밝기
    strokeWeight(FIG_BONE_W);
    const ba=jointToBone[a], bb=jointToBone[b]; 
    if(!ba||!bb) continue;
    const pa=figState.get(ba), pb=figState.get(bb); if(!pa||!pb) continue;
    const ga=worldToFigGrid(pa), gb=worldToFigGrid(pb);
    if(!isFinite(ga.x)||!isFinite(ga.y)||!isFinite(gb.x)||!isFinite(gb.y)) continue;
    const fa=figGridToBox(ga.x,ga.y), fb=figGridToBox(gb.x,gb.y);
    line(fa.x,fa.y,fb.x,fb.y);
  }
  ctx.restore();
}

/* ===================== UI / UTILS ===================== */
function drawOverlay(frameI,timeSec){
  if(!pTL||!pBR) return;
  push(); rectMode(CORNER); noStroke(); textFont('Helvetica'); textSize(16); textAlign(LEFT,TOP);
  const pad = 12;
// 그리드의 오른쪽 변 바로 바깥에 붙여 찍기
const x0 = pBR.x + pad;
const y0 = pTL.y + pad;

if(!useDarkBg){
  const bw = 220, bh = 48;
  fill(255, 225);
  rect(x0 - 6, y0 - 6, bw, bh, 8);
  fill(0, 200);
}else{
  // 다크 배경에선 투명 박스 없이 텍스트만
  fill(0, 0, 100, 235);
}

if(hudToggle && hudToggle.checked){
  text(`Frame: ${frameI}`, x0, y0);
}
text(`Time: ${timeSec.toFixed(2)} s`, x0, y0 + 22);

  pop();
}
function updateInfoBadge(){
  const need=Object.keys(JOINT_ALIASES).length, have=jointToBone?Object.keys(jointToBone).length:0;
  infoBadge.textContent=`Style: ${CURRENT_STYLE_KEY} · Axis: ${PROJECTION} · mapped ${have}/${need} · edges ${autoEdges.length}`;
}
function setTrailMid(){
  if(trailSlider){
    const minV=parseInt(trailSlider.min||"50"), maxV=parseInt(trailSlider.max||"4000");
    const step=parseInt(trailSlider.step||"50");
    const raw=(minV+maxV)/2;
    const snapped = Math.round(raw/step)*step;
    trailSlider.value = String(snapped);
  }
}
function niceTicks(min,max,count){ const span=max-min, step0=span/Math.max(1,count), pow10=Math.pow(10,Math.floor(Math.log10(step0)));
  let step=pow10; const err=step0/pow10; if(err>=7.5) step=10*pow10; else if(err>=3.5) step=5*pow10; else if(err>=1.5) step=2*pow10;
  const tmin=Math.ceil(min/step)*step, tmax=Math.floor(max/step)*step, ticks=[]; for(let v=tmin; v<=tmax+1e-9; v+=step) ticks.push(v); return {ticks, step}; }
function ticksByFixedStep(min,max,step){ const s=(step<=0)?1:step, tmin=Math.ceil(min/s)*s, tmax=Math.floor(max/s)*s, ticks=[];
  for(let v=tmin; v<=tmax+1e-9; v+=s) ticks.push(v); return {ticks, step:s}; }
function subticks(majorTicks,subdiv){ if(majorTicks.length<2||subdiv<2) return []; const out=[];
  for(let i=0;i<majorTicks.length-1;i++){ const a=majorTicks[i], b=majorTicks[i+1], st=(b-a)/subdiv; for(let k=1; k<subdiv; k++) out.push(a+st*k); } return out; }
function formatNum(v,dec){ const m=Math.pow(10,dec); return String(Math.round(v*m)/m); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function norm(v,a,b){ return (v-a)/Math.max(1e-6,(b-a)); }
function updateLegendTone(hShift){
  const hSlow=(HUE_SLOW + hShift) % 360;
  const hFast=(HUE_FAST + hShift) % 360;
  const hMid = ((HUE_SLOW+HUE_FAST)/2 + hShift) % 360;
  document.getElementById('dotSlow').style.background = `hsl(${hSlow}, 70%, 45%)`;
  document.getElementById('dotMid').style.background  = `hsl(${hMid},  90%, 52%)`;
  document.getElementById('dotFast').style.background = `hsl(${hFast}, 100%, 50%)`;
}
function keyPressed(){
  if(key===' ') { playing=!playing; return false; }
  if(keyCode===LEFT_ARROW)  { animFrameF -= 1*FPS; if(animFrameF<minFrame) animFrameF=maxFrame - (minFrame-animFrameF) }
  if(keyCode===RIGHT_ARROW) { animFrameF += 1*FPS; if(animFrameF>maxFrame) animFrameF=minFrame + (animFrameF-maxFrame) }
  if(keyCode===UP_ARROW)    { tempoSlider.value = String(Math.min(2.5, parseFloat(tempoSlider.value)+0.1)); }
  if(keyCode===DOWN_ARROW)  { tempoSlider.value = String(Math.max(0.2, parseFloat(tempoSlider.value)-0.1)); }
  if(key==='S') saveCanvas('movement_map_graphic_trails','png');
}
function showErr(msg){var el=document.getElementById('errBox'); if(el){el.textContent=String(msg||''); el.style.display='block';} else {console.error('[ERR]',msg);} }
</script>

<!-- ===== Restore Save SVGs button + independent ZIP export (failsafe) ===== -->
<script>
(function(){
  // Create or show toolbar button
  function ensureToolbarBtn(){
    var bar = document.getElementById('styleBar');
    var btn = document.getElementById('btnSaveSVGs');
    if(!btn){
      btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'btnSaveSVGs';
      btn.className = 'btn';
      btn.title = '그리드/모션/피규어 + CSV를 ZIP으로 저장';
      btn.textContent = 'Save SVGs';
      if(bar){ 
        var badge = document.getElementById('infoBadge');
        if(badge && badge.parentElement===bar) bar.insertBefore(btn, badge); else bar.appendChild(btn);
      }else{
        (document.body||document.documentElement).appendChild(btn);
      }
    }
    btn.style.display=''; btn.style.visibility='visible';
    return btn;
  }

  // Floating FAB if toolbar button missing/hidden
  function ensureFAB(){
    function hasVisibleBtn(){
      var b=document.getElementById('btnSaveSVGs');
      if(!b) return false;
      var cs=getComputedStyle(b);
      return cs && cs.display!=='none' && cs.visibility!=='hidden';
    }
    var fab=document.getElementById('svgSaveFAB');
    if(!fab){
      fab=document.createElement('button');
      fab.id='svgSaveFAB';
      fab.textContent='Save SVGs';
      fab.title='ZIP으로 저장';
      Object.assign(fab.style, {position:'fixed', right:'16px', top:'16px', zIndex:99999,
        padding:'10px 14px', borderRadius:'10px', border:'none', fontWeight:'600',
        background:'#1f6feb', color:'#fff', boxShadow:'0 6px 18px rgba(0,0,0,.18)', cursor:'pointer'});
      document.body.appendChild(fab);
      fab.addEventListener('click', onClickExport);
    }
    fab.style.display = hasVisibleBtn()? 'none' : 'inline-block';
  }

  // Small helpers (duplicated minimal provider-based export so it works even if original script didn't bind)
  const SVGNS="http://www.w3.org/2000/svg";
  const Q = (id)=> document.getElementById(id);
  function svgEl(tag, attrs={}, text=null){ const el=document.createElementNS(SVGNS, tag); for(const k in attrs) el.setAttribute(k, String(attrs[k])); if(text!=null) el.textContent=text; return el; }
  function svgString(svg){ const s=new XMLSerializer().serializeToString(svg); return `<?xml version="1.0" encoding="UTF-8"?>\n` + s; }
  function toast(msg){ const el = Q('errBox'); if(!el){ alert(msg); return; } el.style.display='block'; el.style.background='#eaf5ff'; el.style.color='#003a7a'; el.textContent = msg; setTimeout(()=>{ el.style.display='none'; }, 1600); }
  function hsbToRgb(h,s,b){ s/=100; b/=100; const k=n=>(n+h/60)%6; const f=n=> b - b*s*Math.max(0, Math.min(k(n),4-k(n), 1)); return [Math.round(f(5)*255), Math.round(f(3)*255), Math.round(f(1)*255)]; }
  function cssFromHSB(h,s,b,a=1){ const [r,g,bl]=hsbToRgb(h,s,b); return `rgba(${r},${g},${bl},${a})`; }

  function getProvider(){
    if (window.mocapExportProvider) return window.mocapExportProvider;
    const shim = {};
    shim.getFrameInfo = function(){
      const cur = Number.isFinite(window.animFrameF) ? Math.round(window.animFrameF) : (window.frameIndex||0);
      const candidates=[ window.ANIM_TOTAL_FRAMES, window.animTotalFrames, window.totalFrames, window.frameCountMax,
        (window.frameTimes&&window.frameTimes.length), (window.allFrames&&window.allFrames.length),
        (window.orderedSegs&&window.orderedSegs.length), (window.frames&&window.frames.length),
        (window.anim&&window.anim.totalFrames), (window.animation&&window.animation.totalFrames) ].filter(v=>Number.isFinite(v)&&v>0);
      let total = candidates.length? candidates[0] : (cur>0?cur:1);
      try{
        if(window.orderedSegs && orderedSegs.length){
          const maxF = orderedSegs.reduce((m,s)=> (s && Number.isFinite(s.f) && s.f>m)? s.f : m, 0);
          if(maxF+1>total) total = maxF+1;
        }
      }catch(_){}
      return {curF: Math.max(0,cur), totalF: Math.max(1,total)};
    };
    shim.getBones = function(){
      if (Array.isArray(window.allVisibleBones) && allVisibleBones.length) return Array.from(allVisibleBones);
      if (Array.isArray(window.bones) && bones.length) return Array.from(bones);
      if (window.figState){ if(typeof figState.keys==='function') return Array.from(figState.keys()); return Object.keys(figState); }
      if (window.jointToBone){ try{ return Object.values(window.jointToBone); }catch(_){ } }
      return [];
    };
    shim.getPoseAtFrame = function(b,f){
      if (typeof window.sampleBoneAtFrameF==='function') return sampleBoneAtFrameF(b,f);
      if (window.figState) return (typeof figState.get==='function'? figState.get(b) : figState[b]) || null;
      return null;
    };
    shim.getSegments = function(){
      if (Array.isArray(window.orderedSegs) && orderedSegs.length) return orderedSegs;
      if (Array.isArray(window.segments) && segments.length) return segments;
      return [];
    };
    shim.getContextLines = function(){ return (Array.isArray(window.contextLines)&&contextLines.length)? contextLines : []; };
    shim.getFigureBox = function(){
      if (window.figBox) return figBox;
      if (window.fpTL && window.fpBR){ return {pTL:fpTL, pBR:fpBR, size: Math.max(1, Math.abs((fpBR.x||0)-(fpTL.x||0)))}; }
      return {pTL:{x:0,y:0}, pBR:{x:260,y:260}, size:260};
    };
    shim.getLeftViewSize = function(){
      if (window.pTL && window.pBR){
        return {w: Math.max(1, Math.round(Math.abs(pBR.x - pTL.x))), h: Math.max(1, Math.round(Math.abs(pBR.y - pTL.y)))};
      }
      const cv = document.querySelector('canvas');
      if (cv) return {w: Math.round((cv.width||cv.clientWidth||1600)/2), h: (cv.height||cv.clientHeight||900)};
      return {w:800, h:600};
    };
    return shim;
  }

  function buildGridSVG(p){
    const {w,h}=p.getLeftViewSize();
    const svg=svgEl('svg',{xmlns:SVGNS,width:w,height:h,viewBox:`0 0 ${w} ${h}`});
    const colMinor='rgba(0,0,0,0.10)', colMajor='rgba(0,0,0,0.24)', colAxis='rgba(0,0,0,0.55)';
    svg.appendChild(svgEl('rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:colAxis,'stroke-width':1.6}));
    const nx=8, ny=6;
    for(let i=1;i<nx;i++){ const x=w*i/nx; svg.appendChild(svgEl('line',{x1:x,y1:0,x2:x,y2:h,stroke:(i%4===0?colMajor:colMinor),'stroke-width':(i%4===0?1.0:0.6)})); }
    for(let j=1;j<ny;j++){ const y=h*j/ny; svg.appendChild(svgEl('line',{x1:0,y1:y,x2:w,y2:y,stroke:(j%3===0?colMajor:colMinor),'stroke-width':(j%3===0?1.0:0.6)})); }
    return svgString(svg);
  }

  function buildMotionSVG(p){
    const segs = p.getSegments();
    const ctxLines = p.getContextLines();
    const sz = p.getLeftViewSize(); const w=sz.w, h=sz.h;
    const svg=svgEl('svg',{xmlns:SVGNS,width:w,height:h,viewBox:`0 0 ${w} ${h}`});
    const mode = (Q('renderMode')||{}).value || 'lines';
    const hasSegs = segs && segs.length;

    if(hasSegs){
      const info=p.getFrameInfo();
      const trailEl = Q('trail'); const trail = trailEl? parseInt(trailEl.value||'2000',10) : 2000;
      // find end idx by frame
      let endIdx = segs.length-1;
      for(let i=0;i<segs.length;i++){ const s=segs[i]; if(s && Number.isFinite(s.f) && s.f>info.curF){ endIdx = Math.max(0,i-1); break; } }
      const iStart=Math.max(0, endIdx - trail);
      const sizeMul = (window.pSize||1.0);
      const Hslow = (typeof HUE_SLOW==='number'?HUE_SLOW:200);
      const Hfast = (typeof HUE_FAST==='number'?HUE_FAST:20);
      if(mode==='shapes'){
        for(let i=iStart;i<=endIdx;i++){ const seg=segs[i]; if(!seg||!seg.b) continue;
          const t=seg.tSm||0.5; const hue=((Hslow+(Hfast-Hslow)*t)+((parseInt((Q('tone')||{}).value)||0)))%360;
          const alpha=0.7; const szPt=(4+18*t)*(1.2*sizeMul);
          svg.appendChild(svgEl('circle',{cx:seg.b.x, cy:seg.b.y, r:szPt/2, fill:cssFromHSB(hue,80,70+30*t,alpha), stroke:'none'}));
        }
      }else{
        for(let i=iStart;i<=endIdx;i++){ const seg=segs[i]; if(!seg||!seg.a||!seg.b) continue;
          const t=seg.tSm||0.5; const hue=((Hslow+(Hfast-Hslow)*t)+((parseInt((Q('tone')||{}).value)||0)))%360;
          const weight=(1+10*t)*0.7*(window.pSize||1.0);
          svg.appendChild(svgEl('line',{x1:seg.a.x, y1:seg.a.y, x2:seg.b.x, y2:seg.b.y, stroke:cssFromHSB(hue,85,80,0.8), 'stroke-width':weight, 'stroke-linecap':'round'}));
        }
      }
      return svgString(svg);
    }

    if(ctxLines && ctxLines.length){
      const ctxStroke='rgba(50,120,220,0.36)';
      for(const pts of ctxLines){ for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
        svg.appendChild(svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:ctxStroke,'stroke-width':1,'stroke-linecap':'round'})); } }
      return svgString(svg);
    }

    // Raster fallback
    try{
      const cv=document.querySelector('canvas');
      if(cv){ const off=document.createElement('canvas'); off.width=cv.width; off.height=cv.height;
        off.getContext('2d').drawImage(cv,0,0); const url=off.toDataURL('image/png');
        svg.appendChild(svgEl('image',{href:url,x:0,y:0,width:off.width,height:off.height}));
      }
    }catch(_){}
    return svgString(svg);
  }

  function buildFigureSVG(p){
    const box=p.getFigureBox(); const size=Math.round(box.size||260);
    const svg=svgEl('svg',{xmlns:SVGNS,width:size,height:size,viewBox:`0 0 ${size} ${size}`});
    const edges=(window.autoEdges && Array.from(window.autoEdges)) || [];
    if(!edges.length) return null;
    const gx0=Math.min((box.pTL&&box.pTL.x)||0,(box.pBR&&box.pBR.x)||size);
    const gy0=Math.min((box.pTL&&box.pTL.y)||0,(box.pBR&&box.pBR.y)||size);
    const gx1=Math.max((box.pTL&&box.pTL.x)||0,(box.pBR&&box.pBR.x)||size);
    const gy1=Math.max((box.pTL&&box.pTL.y)||0,(box.pBR&&box.pBR.y)||size);
    const tx=x=>(x-gx0)/Math.max(1,(gx1-gx0))*size;
    const ty=y=>(y-gy0)/Math.max(1,(gy1-gy0))*size;
    const info=p.getFrameInfo(); const stroke='rgba(30,30,30,0.9)'; const sw=(window.FIG_BONE_W||3);
    for(const e of edges){
      const a=Array.isArray(e)?e[0]:e.a, b=Array.isArray(e)?e[1]:e.b;
      const ba=window.jointToBone? (window.jointToBone[a]||a) : a;
      const bb=window.jointToBone? (window.jointToBone[b]||b) : b;
      const pa=p.getPoseAtFrame(ba, info.curF), pb=p.getPoseAtFrame(bb, info.curF);
      if(!pa||!pb) continue;
      if(!Number.isFinite(pa.x)||!Number.isFinite(pa.y)||!Number.isFinite(pb.x)||!Number.isFinite(pb.y)) continue;
      svg.appendChild(svgEl('line',{x1:tx(pa.x),y1:ty(pa.y),x2:tx(pb.x),y2:ty(pb.y),stroke,'stroke-width':sw,'stroke-linecap':'round'}));
    }
    return svgString(svg);
  }

  function buildCSV(p){
    const info=p.getFrameInfo(); const bones=p.getBones(); const rows=["bone,x,y,z"];
    if(bones.length){
      for(const b of bones){
        const pt=p.getPoseAtFrame(b, info.curF); if(!pt) continue;
        rows.push(`${b},${Number(pt.x||0).toFixed(6)},${Number(pt.y||0).toFixed(6)},${Number(pt.z||0).toFixed(6)}`);
      }
    }else rows.push("NO_BONES_DATA,0,0,0");
    return {csv:rows.join("\n"), name:`all_bones_coords_${info.curF}of${info.totalF}.csv`};
  }

  async function onClickExport(){
    try{ await window.__loadJSZip(); }catch(e){ console.error(e); alert('ZIP 라이브러리(JSZip) 로드 실패: '+e.message); return; }
    // Prefer original handler if attached by earlier script
    if (typeof window.saveAllSVGs === 'function'){ try{ return window.saveAllSVGs(); }catch(_){ } }
    // Failsafe path:
    if (window.playing){ toast('스페이스바를 누른 후 저장하세요'); return; }
    const p=getProvider();
    const styleKey=(window.CURRENT_STYLE_KEY||'style'); const proj=(window.PROJECTION||'XY');
    const grid=buildGridSVG(p); const motion=buildMotionSVG(p); const fig=buildFigureSVG(p); const {csv,name}=buildCSV(p);
    try{
      const zip=new JSZip();
      zip.file(`map_${styleKey}_${proj}_grid.svg`, grid);
      zip.file(`map_${styleKey}_${proj}_motion_${(Q('renderMode')?.value||'lines')}.svg`, motion);
      zip.file(`map_${styleKey}_${proj}_figure.svg`, fig || '<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"></svg>');
      zip.file(name, csv);
      const blob=await zip.generateAsync({type:"blob"});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`export_bundle_${styleKey}_${proj}.zip`; document.body.appendChild(a); a.click(); a.remove();
      toast('ZIP 저장 완료');
    }catch(e){ console.error(e); toast('ZIP 저장 중 오류: '+e.message); }
  }

  function bind(){
    const btn=ensureToolbarBtn();
    if(btn && !btn.__btnFixBound){ btn.addEventListener('click', onClickExport); btn.__btnFixBound=true; }
    ensureFAB();
  }
  document.addEventListener('DOMContentLoaded', bind);
  bind();
  setInterval(ensureFAB, 1000);
  try{ new MutationObserver(bind).observe(document.body||document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>



<!-- ===== Transparent PNG Export + CSV (ZIP) — v2 ===== -->
<script>
(function(){
  const SVGNS="http://www.w3.org/2000/svg";
  const Q=(id)=>document.getElementById(id);

  function toast(msg){ const el=Q('errBox'); if(!el){ alert(msg); return; } el.style.display='block'; el.style.background='#eaf5ff'; el.style.color='#003a7a'; el.textContent=msg; setTimeout(()=>{ el.style.display='none'; },1600); }
  function svgEl(tag, attrs={}, text=null){ const el=document.createElementNS(SVGNS,tag); for(const k in attrs) el.setAttribute(k,String(attrs[k])); if(text!=null) el.textContent=text; return el; }
  function svgString(svg){ const s=new XMLSerializer().serializeToString(svg); return `<?xml version="1.0" encoding="UTF-8"?>\n`+s; }

  // Robust frame info
  function getFrameInfo(){
    let minF = (typeof window.minFrame==='number')? window.minFrame : 0;
    let maxF = (typeof window.maxFrame==='number')? window.maxFrame : 0;
    if ((!maxF || maxF<=minF) && Array.isArray(window.orderedSegs) && window.orderedSegs.length){
      let mf=0; for(const s of orderedSegs){ if(s && Number.isFinite(s.frameF) && s.frameF>mf) mf = s.frameF|0; }
      maxF = mf;
    }
    const total = Math.max(1, (maxF-minF+1)|0);
    let cur = Number.isFinite(window.animFrameF)? Math.round(window.animFrameF) : 0;
    cur = Math.max(minF, Math.min(maxF, cur));
    return {minF, maxF, curF: cur, totalF: total};
  }

  function leftViewSize(){
    if (window.pTL && window.pBR){ return {w: Math.max(1, Math.round(Math.abs(pBR.x-pTL.x))), h: Math.max(1, Math.round(Math.abs(pBR.y-pTL.y)))}; }
    const cv = document.querySelector('canvas');
    if (cv) return {w: Math.round((cv.width||cv.clientWidth||1600)/2), h: (cv.height||cv.clientHeight||900)};
    return {w:800, h:600};
  }

  // Build vector-only SVGs (transparent) for grid/motion/figure, then rasterize to PNG
  function buildGridSVG(){
    const {w,h}=leftViewSize();
    const svg=svgEl('svg',{xmlns:SVGNS,width:w,height:h,viewBox:`0 0 ${w} ${h}`});
    const colMinor='#00000026', colMajor='#0000003c', colAxis='#0000008c';
    svg.appendChild(svgEl('rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:colAxis,'stroke-width':1.6}));
    const nx=8, ny=6;
    for(let i=1;i<nx;i++){ const x=w*i/nx; svg.appendChild(svgEl('line',{x1:x,y1:0,x2:x,y2:h,stroke:(i%4===0?colMajor:colMinor),'stroke-width':(i%4===0?1.0:0.6)})); }
    for(let j=1;j<ny;j++){ const y=h*j/ny; svg.appendChild(svgEl('line',{x1:0,y1:y,x2:w,y2:y,stroke:(j%3===0?colMajor:colMinor),'stroke-width':(j%3===0?1.0:0.6)})); }
    return {svg,w,h};
  }

  function hsbToRgb(h,s,b){ s/=100; b/=100; const k=n=>(n+h/60)%6; const f=n=> b - b*s*Math.max(0, Math.min(k(n),4-k(n),1)); return [Math.round(f(5)*255), Math.round(f(3)*255), Math.round(f(1)*255)]; }
  function rgbaFromHSB(h,s,b,a=1){ const [r,g,bl]=hsbToRgb(h,s,b); return `rgba(${r},${g},${bl},${a})`; }

  function buildMotionSVG(){
    const segs = (Array.isArray(window.orderedSegs) && orderedSegs.length)? orderedSegs : null;
    const ctxLines = (Array.isArray(window.contextLines) && contextLines.length)? contextLines : null;
    const {w,h}=leftViewSize();
    const svg=svgEl('svg',{xmlns:SVGNS,width:w,height:h,viewBox:`0 0 ${w} ${h}`});
    const mode = (Q('renderMode')||{}).value || 'lines';
    const tone = parseInt((Q('tone')||{}).value||'0',10);
    const Hslow=(typeof HUE_SLOW==='number'?HUE_SLOW:200), Hfast=(typeof HUE_FAST==='number'?HUE_FAST:20);
    const sizeMul = (window.pSize||1.0);

    if(segs){
      const frameF = Number.isFinite(window.animFrameF)? window.animFrameF : 0;
      let endIdx = segs.length-1;
      for(let i=0;i<segs.length;i++){ const s=segs[i]; if(s && Number.isFinite(s.frameF) && s.frameF>frameF){ endIdx=Math.max(0,i-1); break; } }
      const trail = Q('trail')? parseInt(Q('trail').value||'2000',10) : 2000;
      const startIdx = Math.max(0, endIdx - trail);
      if(mode==='shapes'){
        for(let i=startIdx;i<=endIdx;i++){ const sg=segs[i]; if(!sg||!sg.b) continue;
          const t=sg.tSm||0.5; const hue=(Hslow+(Hfast-Hslow)*t+tone)%360; const sz=(4+18*t)*1.2*sizeMul;
          svg.appendChild(svgEl('circle',{cx:sg.b.x, cy:sg.b.y, r:sz/2, fill:rgbaFromHSB(hue,80,70+30*t,0.85), stroke:'none'}));
        }
      }else{
        for(let i=startIdx;i<=endIdx;i++){ const sg=segs[i]; if(!sg||!sg.a||!sg.b) continue;
          const t=sg.tSm||0.5; const hue=(Hslow+(Hfast-Hslow)*t+tone)%360; const wgt=(1+10*t)*0.7*sizeMul;
          svg.appendChild(svgEl('line',{x1:sg.a.x,y1:sg.a.y,x2:sg.b.x,y2:sg.b.y,stroke:rgbaFromHSB(hue,85,80,0.9),'stroke-width':wgt,'stroke-linecap':'round'}));
        }
      }
      return {svg,w,h};
    }

    if(ctxLines){
      for(const pts of ctxLines){ for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
        svg.appendChild(svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'rgba(50,120,220,0.36)','stroke-width':1,'stroke-linecap':'round'})); } }
    } else {
      svg.appendChild(svgEl('rect',{x:0,y:0,width:1,height:1,fill:'none',stroke:'none'}));
    }
    return {svg,w,h};
  }

  function buildFigureSVG(){
    const edges = (window.autoEdges && Array.from(window.autoEdges)) || [];
    if(!edges.length) return {svg:null,w:0,h:0};
    const size = Math.round((window.figBox && figBox.size) || 260);
    const svg=svgEl('svg',{xmlns:SVGNS,width:size,height:size,viewBox:`0 0 ${size} ${size}`});
    const box = window.figBox || {pTL:{x:0,y:0}, pBR:{x:size,y:size}, size};
    const gx0=Math.min((box.pTL&&box.pTL.x)||0,(box.pBR&&box.pBR.x)||size);
    const gy0=Math.min((box.pTL&&box.pTL.y)||0,(box.pBR&&box.pBR.y)||size);
    const gx1=Math.max((box.pTL&&box.pTL.x)||0,(box.pBR&&box.pBR.x)||size);
    const gy1=Math.max((box.pTL&&box.pTL.y)||0,(box.pBR&&box.pBR.y)||size);
    const tx=x=>(x-gx0)/Math.max(1,(gx1-gx0))*size, ty=y=>(y-gy0)/Math.max(1,(gy1-gy0))*size;
    const info = getFrameInfo();
    const getPose = (b)=> (typeof sampleBoneAtFrameF==='function'? sampleBoneAtFrameF(b, info.curF) : (figState?(figState.get?figState.get(b):figState[b]):null));
    const stroke='rgba(30,30,30,0.95)'; const sw=(window.FIG_BONE_W||3);
    for(const e of edges){
      const a=Array.isArray(e)?e[0]:e.a, b=Array.isArray(e)?e[1]:e.b;
      const ba=window.jointToBone? (window.jointToBone[a]||a) : a;
      const bb=window.jointToBone? (window.jointToBone[b]||b) : b;
      const pa=getPose(ba), pb=getPose(bb);
      if(!pa||!pb) continue;
      if(!Number.isFinite(pa.x)||!Number.isFinite(pa.y)||!Number.isFinite(pb.x)||!Number.isFinite(pb.y)) continue;
      svg.appendChild(svgEl('line',{x1:tx(pa.x),y1:ty(pa.y),x2:tx(pb.x),y2:ty(pb.y),stroke,'stroke-width':sw,'stroke-linecap':'round'}));
    }
    return {svg,w:size,h:size};
  }

  async function svgToPngDataURL(svgStr, w, h, scale=2){
    return new Promise((resolve, reject)=>{
      try{
        const blob = new Blob([svgStr], {type:'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = ()=>{
          const cw = Math.ceil(w*scale), ch = Math.ceil(h*scale);
          const c = document.createElement('canvas');
          c.width=cw; c.height=ch;
          const ctx = c.getContext('2d', {alpha:true});
          ctx.clearRect(0,0,cw,ch); // ensure transparent
          ctx.setTransform(scale,0,0,scale,0,0);
          ctx.drawImage(img, 0,0, w,h);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(new Error('SVG->PNG 변환 실패')); };
        img.src = url;
      }catch(e){ reject(e); }
    });
  }

  function buildCSV(){
    const info=getFrameInfo();
    let bones=[];
    if (Array.isArray(window.allVisibleBones) && allVisibleBones.length) bones = Array.from(allVisibleBones);
    else if (Array.isArray(window.bones) && bones.length) bones = Array.from(bones);
    else if (window.figState){ bones = (typeof figState.keys==='function')? Array.from(figState.keys()) : Object.keys(figState); }
    const rows=["bone,x,y,z"];
    if(bones.length){
      for(const b of bones){
        let p=null;
        if (typeof sampleBoneAtFrameF==='function') p=sampleBoneAtFrameF(b, info.curF);
        if(!p && window.figState) p=(figState.get?figState.get(b):figState[b])||null;
        if(!p) continue;
        rows.push(`${b},${Number(p.x||0).toFixed(6)},${Number(p.y||0).toFixed(6)},${Number(p.z||0).toFixed(6)}`);
      }
    }else{
      rows.push("NO_BONES_DATA,0,0,0");
    }
    return {csv: rows.join("\\n"), name: `all_bones_coords_${info.curF}of${info.totalF}.csv`};
  }

  async function saveZipPNGs(){
    if(window.playing){ toast('스페이스바를 누른 후 저장하세요'); return; }
    try{ await (window.__loadJSZip ? window.__loadJSZip() : Promise.resolve()); }
    catch(e){ console.error(e); toast('ZIP 라이브러리(JSZip) 로드 실패'); return; }

    const styleKey=(window.CURRENT_STYLE_KEY||'style'); const proj=(window.PROJECTION||'XY');

    const G = buildGridSVG();
    const M = buildMotionSVG();
    const F = buildFigureSVG();

    const gridPNG = await svgToPngDataURL(svgString(G.svg), G.w, G.h, 2);
    const motionPNG = await svgToPngDataURL(svgString(M.svg), M.w, M.h, 2);
    const figurePNG = F.svg ? await svgToPngDataURL(svgString(F.svg), F.w, F.h, 2) : null;

    const {csv:csvText, name:csvName} = buildCSV();

    try{
      const zip = new JSZip();
      function addDataURL(zipPath, dataURL){
        const b64 = dataURL.split(',')[1];
        zip.file(zipPath, b64, {base64:true});
      }
      addDataURL(`map_${styleKey}_${proj}_grid.png`, gridPNG);
      addDataURL(`map_${styleKey}_${proj}_motion.png`, motionPNG);
      if(figurePNG) addDataURL(`map_${styleKey}_${proj}_figure.png`, figurePNG);
      else zip.file(`map_${styleKey}_${proj}_figure.png`, new Uint8Array([]));
      zip.file(csvName, csvText);

      const blob = await zip.generateAsync({type:"blob"});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`export_bundle_${styleKey}_${proj}.zip`; document.body.appendChild(a); a.click(); a.remove();
      toast('ZIP 저장 완료 (투명 PNG + CSV)');
    }catch(e){ console.error(e); toast('ZIP 저장 중 오류: '+e.message); }
  }

  function bind(){
    const btn = Q('btnSavePNGs');
    if(btn && !btn.__pngBound){ btn.addEventListener('click', saveZipPNGs); btn.__pngBound=true; }
  }
  document.addEventListener('DOMContentLoaded', bind);
  bind();
})();
</script>


<script>
(function(){
  function hideUI(){
    try{
      var tbtn=document.getElementById('uiToggleBtn'); if(tbtn) tbtn.style.display='none';
      var bar=document.getElementById('styleBar')||document.querySelector('.topbar'); if(bar) bar.style.display='none';
      var ui=document.querySelector('.ui'); if(ui) ui.style.display='none';
      var hud=document.getElementById('hudToggle'); if(hud){ hud.checked=false; hud.dispatchEvent(new Event('input',{bubbles:true})); }
      document.body.style.background='#000';
    }catch(e){}
  }
  function showUI(){
    try{
      var tbtn=document.getElementById('uiToggleBtn'); if(tbtn) tbtn.style.display='';
      var bar=document.getElementById('styleBar')||document.querySelector('.topbar'); if(bar) bar.style.display='';
      var ui=document.querySelector('.ui'); if(ui) ui.style.display='';
    }catch(e){}
  }
  function randomize(){
    try{
      var sel=document.getElementById('renderMode')||document.querySelector('#renderMode, select[name="renderMode"]');
      if(sel && sel.options && sel.options.length){
        var cur=sel.value, opts=[].slice.call(sel.options).map(o=>o.value);
        var next=cur; if(opts.length>1){ do{ next=opts[Math.floor(Math.random()*opts.length)]; }while(next===cur); }
        sel.value=next; sel.dispatchEvent(new Event('change',{bubbles:true}));
      }
      var tone=document.getElementById('tone')||document.querySelector('input[name="tone"]')||document.getElementById('toneSlider');
      if(tone){ var max=parseInt(tone.max||'360',10); tone.value=String(Math.floor(Math.random()*(max+1))); tone.dispatchEvent(new Event('input',{bubbles:true})); tone.dispatchEvent(new Event('change',{bubbles:true})); }
    }catch(e){}
  }
  var t=null;
  window.addEventListener('load', function(){
    window.__COVER__ = window.__COVER__ || {};
    // cover enter
    window.__COVER__.on = true;
    hideUI();
    var ov=document.getElementById('coverLoading'); if(ov){ ov.style.display='flex'; }
    if(t) clearInterval(t); t=setInterval(randomize, 5000);
    // hide overlay when canvas appears
    var t0=performance.now();
    (function chk(){
      var ready=!!document.querySelector('canvas.p5Canvas, canvas'), timeout=performance.now()-t0>7000;
      if(ready||timeout){ if(ov){ ov.classList.add('hidden'); setTimeout(()=>{ ov.style.display='none'; },300);} }
      else setTimeout(chk,120);
    })();
    // wire start
    var btn=document.getElementById('startBtn'); if(btn){
      btn.style.display='block';
      btn.onclick=function(){
        window.__COVER__.on=false;
        if(t) {clearInterval(t); t=null;}
        showUI();
        // ensure HUD/grid ON
        try{
          var hud=document.getElementById('hudToggle');
          if(hud && !hud.checked){
            hud.checked=true;
            hud.dispatchEvent(new Event('input',{bubbles:true}));
            hud.dispatchEvent(new Event('change',{bubbles:true}));
          }
        }catch(e){}
        if(ov) ov.style.display='none';
        // auto select Popping
        var clicked=false, bar=document.getElementById('styleBar');
        if(bar){
          var pop=[].slice.call(bar.querySelectorAll('.btn[data-style]')).find(b=>(b.dataset.style||'').toLowerCase()==='popping');
          if(pop){ pop.click(); clicked=true; }
        }
        if(!clicked){
          var sel=document.querySelector('select[name="style"], #styleSelect');
          if(sel){ var opt=[].slice.call(sel.options).find(o=>/popping/i.test(o.value||o.text||'')); if(opt){ sel.value=opt.value; sel.dispatchEvent(new Event('change',{bubbles:true})); } }
        }
        // reset frame/time and render mode lines
        setTimeout(function(){
          try{ if(typeof setFrame==='function') setFrame(0); }catch(e){}
          try{ if(typeof animFrameF!=='undefined') animFrameF=0; }catch(e){}
          try{ if(typeof animFrame!=='undefined') animFrame=0; }catch(e){}
          try{
            var rm=document.getElementById('renderMode')||document.querySelector('#renderMode, select[name="renderMode"]');
            if(rm){ rm.value='shapes'; rm.dispatchEvent(new Event('change',{bubbles:true})); }
          }catch(e){}
        }, 120);
        btn.style.display='none';
      };
    }
  }, {once:true});
})();
</script>

<script>
(function(){
  function moveUI(){
    try{
      // UI root
      var ui = document.querySelector('.ui');
      if(!ui) return;

      // Create a top container if not exists
      var topBox = document.getElementById('uiTopBox');
      if(!topBox){
        topBox = document.createElement('div');
        topBox.id = 'uiTopBox';
        topBox.style.display = 'flex';
        topBox.style.flexDirection = 'column';
        topBox.style.gap = '6px';
        ui.insertBefore(topBox, ui.firstChild);
      }

      // ① move background checkboxes (bgToggle, hudToggle, trailBgToggle) to top
      ['bgToggle','hudToggle','trailBgToggle'].forEach(function(id){
        var el = document.getElementById(id);
        if(!el) return;
        var row = el.closest('label') || el.closest('.row') || el.parentElement;
        if(row && row !== topBox){
          topBox.appendChild(row);
        }
      });

      // ② Under that, place Part & Bone selects in a single row
      var part = document.getElementById('partSelect') || document.getElementById('partSel') || document.querySelector('select[name="part"]');
      var bone = document.getElementById('boneSelect') || document.getElementById('boneSel') || document.querySelector('select[name="bone"]');
      if(part || bone){
        var row = document.getElementById('partBoneRow');
        if(!row){
          row = document.createElement('div');
          row.id = 'partBoneRow';
          row.className = 'row';
          row.style.display='flex';
          row.style.gap='8px';
          row.style.alignItems='center';
          topBox.appendChild(row);
        }
        if(part){
          var pWrap = part.closest('.row') || part.closest('label') || part.parentElement;
          if(pWrap && pWrap!==row){ row.appendChild(pWrap); }
          else if(part.parentElement!==row){ row.appendChild(part); }
        }
        if(bone){
          var bWrap = bone.closest('.row') || bone.closest('label') || bone.parentElement;
          if(bWrap && bWrap!==row){ row.appendChild(bWrap); }
          else if(bone.parentElement!==row){ row.appendChild(bone); }
        }
      }

      // ③ Ensure "Color" row (with btnBW) stays just below part/bone; Random Style button is added elsewhere.
      var bw = document.getElementById('btnBW');
      if(bw){
        var colorRow = bw.closest('.row') || bw.parentElement;
        if(colorRow && colorRow !== topBox){
          // insert after topBox
          if(topBox.nextSibling !== colorRow){
            ui.insertBefore(colorRow, topBox.nextSibling);
          }
        }
      }

      // ④ Move Render Mode block below Color row (best-effort)
      var renderSel = document.getElementById('renderMode') || document.querySelector('#renderMode, select[name="renderMode"]');
      if(renderSel){

<script id="slider-values-patch">
(function(){
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn, {once:true}); }
  ready(function(){
    var panel = document.querySelector('.ui') || document.body;
    if(!panel) return;
    var sliders = panel.querySelectorAll('input[type="range"]');
    if(!sliders || !sliders.length) return;

    // Ensure only the 4 main sliders get labels (tempo, trail, tone, particle)
    // Heuristic: take the last 4 range inputs (they usually come last in the UI)
    var arr = Array.prototype.slice.call(sliders);
    if (arr.length > 4) arr = arr.slice(-4);

    arr.forEach(function(s){
      // Skip if already wrapped
      if (s.parentElement && s.parentElement.classList && s.parentElement.classList.contains('slider-row')) return;

      var wrap = document.createElement('div');
      wrap.className = 'slider-row';
      s.parentNode.insertBefore(wrap, s);
      wrap.appendChild(s);

      var val = document.createElement('span');
      val.className = 'slider-val';
      wrap.appendChild(val);

      function sync(){
        var max = s.max ? Number(s.max) : 0;
        var v   = s.value !== undefined ? Number(s.value) : 0;
        val.textContent = max ? (v + " / " + max) : String(v);
      }
      s.addEventListener('input', sync);
      s.addEventListener('change', sync);
      // In case code updates value without events, observe attribute
      var mo = new MutationObserver(sync);
      mo.observe(s, {attributes:true, attributeFilter:['value']});
      // Initial
      setTimeout(sync, 0);
    });
  });
})();
</script>


<script>
(function(){
  try {
    const ui  = document.querySelector('.ui');
    const btn = document.getElementById('uiToggleBtn');
    if(!ui || !btn) return;

    // initial state
    let collapsed = false;

    function updateBtn(){
      btn.innerHTML = collapsed ? '&gt;' : '&lt;';
    }

    function collapse(){
      collapsed = true;
      // compute collapsed width ~ 45% of current, clamped
      const rect = ui.getBoundingClientRect();
      const w = Math.max(120, Math.round(rect.width || 180));
      const target = Math.max(60, Math.min(Math.round(w * 0.45), Math.round(w * 0.5)));
      ui.style.setProperty('--collapsed-w', target + 'px');
      ui.classList.add('collapsed');
      updateBtn();
    }

    function expand(){
      collapsed = false;
      ui.classList.remove('collapsed');
      // restore typical left if inline styles are used in this file
      if (ui.style && ui.style.left !== undefined) {
        ui.style.left = '16px';
      }
      updateBtn();
    }

    btn.addEventListener('click', () => (collapsed ? expand() : collapse()));
    updateBtn();
  } catch(e){
    console.error('UI toggle init error:', e);
  }
})();
</script>

<script>
// === Figure toggle inside UI ===
(function(){
  try{
    if (window.__figureToggleInitialized) return;
    window.__figureToggleInitialized = true;

    // state
    window.__showFigure = true;

    function setFigureVisible(v){
      window.__showFigure = !!v;
      // Try hide any dedicated canvas or layers that look like figure
      var candidates = [];
      var byId = ['figureCanvas', 'figure-canvas', 'stickFigureCanvas', 'stick-figure-canvas', 'figureLayer'];
      byId.forEach(function(id){ var el = document.getElementById(id); if(el) candidates.push(el); });
      var byCls = ['figure','figure-canvas','stick-figure','stickfigure','figure-layer'];
      byCls.forEach(function(cls){ document.querySelectorAll('.'+cls).forEach(function(el){ candidates.push(el); }); });
      candidates.forEach(function(el){ el.style.display = window.__showFigure ? '' : 'none'; });
    }

    // Patch drawFigureMapped(frameF) if exists to skip drawing when OFF
    function patchDraw(){
      if (typeof window.drawFigureMapped === 'function' && !window.__orig_drawFigureMapped){
        window.__orig_drawFigureMapped = window.drawFigureMapped;
        window.drawFigureMapped = function(frameF){
          if (!window.__showFigure) return;
          return window.__orig_drawFigureMapped(frameF);
        };
        return true;
      }
      return false;
    }
    if (!patchDraw()){
      var t = setInterval(function(){ if(patchDraw()) clearInterval(t); }, 300);
      setTimeout(function(){ try{ clearInterval(t); }catch(_){ } }, 12000);
    }

    // Hook UI checkbox
    function bindCheckbox(){
      var chk = document.getElementById('figureToggleChk');
      if(!chk) return false;
      chk.addEventListener('change', function(){
        setFigureVisible(!!chk.checked);
      });
      // init
      chk.checked = true;
      setFigureVisible(true);
      return true;
    }
    if (!bindCheckbox()){
      var t2 = setInterval(function(){ if(bindCheckbox()) clearInterval(t2); }, 300);
      setTimeout(function(){ try{ clearInterval(t2); }catch(_){ } }, 12000);
    }
  }catch(e){
    console.error('figure toggle setup error', e);
  }
})();
</script>

function randomizeRenderAndTone(){
  try{
    const sel = document.getElementById('renderMode') || document.querySelector('#renderMode, select[name="renderMode"]');
    if(sel && sel.options && sel.options.length){
      const opts = Array.from(sel.options);
      const blocked = [/trail\s*lines/i, /text\s*graffiti/i];
      let allowed = opts.filter(o=>{
        const str = (o.text||'') + ' ' + (o.value||'');
        return !blocked.some(re=> re.test(str));
      }).map(o=>o.value);
      if(!allowed.length){ allowed = opts.map(o=>o.value); } // safety fallback
      const cur = sel.value;
      let next = cur;
      if(allowed.length>1){
        do{ next = allowed[Math.floor(Math.random()*allowed.length)]; } while(next === cur);
      }else{
        next = allowed[0];
      }
      if(next !== cur){
        sel.value = next;
        sel.dispatchEvent(new Event('change', {bubbles:true}));
      }
    }
    const tone = document.getElementById('tone') || document.querySelector('input[name="tone"]') || document.getElementById('toneSlider');
    if(tone){
      const max = parseInt(tone.max || '360', 10);
      tone.value = String(Math.floor(Math.random()*(max+1)));
      tone.dispatchEvent(new Event('input', {bubbles:true}));
      tone.dispatchEvent(new Event('change', {bubbles:true}));
    }
  }catch(e){}
}
